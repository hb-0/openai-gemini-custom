version: '3.8'

services:
  gemini-proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/models', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service with hot reload - uses same Dockerfile but mounts source for live reload
  gemini-proxy-dev:
    build: .
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    profiles:
      - dev